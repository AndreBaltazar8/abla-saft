name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31
        with:
          nix_path: nixpkgs=channel:nixos-unstable
      - uses: AndreBaltazar8/setup-abla@f13f659af61ed16f0f2568964ff5b5f3344ec70a # main, signed Abla v0.2.67 support
        with:
          version: '0.2.67'
      - name: Download AT's schema, demonstration file and texts, by hash
        run: tools/fetch-sources.sh
      - name: Unit, golden, property and schema-corpus tests
        run: make test-in-shell COMPILER=ablac
      - name: Build tools and the example
        run: make programs-in-shell COMPILER=ablac
      - name: Generated files through the official XSD, control totals, decimals against bc
        run: |
          nix-shell -p bc --run 'tools/check-all.sh 200'
      - name: Signatures against openssl, QR images through zbar
        run: |
          nix-shell -p openssl zbar --run tools/check-signatures.sh
      - name: AT's demonstration file through the XSD, reader and writer
        run: |
          tools/check-at-demo.sh
      - name: src/codes.ab is what the generator makes of the official XSD
        run: build/gen-codes .sources/saftpt1.04_01.xsd | cmp - src/codes.ab
